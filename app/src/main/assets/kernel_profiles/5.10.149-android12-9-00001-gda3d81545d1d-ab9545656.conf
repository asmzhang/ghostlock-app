execution {
  # Highest-frequency cluster on marble is 4-5 at 2.50 GHz.
  recommended_cpus {
    main = 4
    consumer = 5
  }
  selected_cpus {
    main = 4
    consumer = 5
  }
  race {
    route_done_timeout_ms = 300000
    setup_settle_us = 50000
    route_wait_ms = 1000
    state_poll_interval_us = 1000
  }
  stages {
    w1_attempts = 15
    w1_settle_us = 100000
    w1_scratch_repair_attempts = 3
    w2_attempts = 15
    w2_settle_us = 100000
    # W3 is enabled at one attempt per write, after measuring what disabling it
    # costs on device: with w3_attempts = 0 the rooted child forks its root
    # shell, execve hands control to mksh, and the shell dies of SIGSYS (waitpid
    # status 31) before its first command. The app's own seccomp filter is still
    # armed in that child, so nothing the root shell starts survives, and the
    # handoff script never runs a line. W3 is the only stage that clears
    # TIF_SECCOMP and seccomp.mode. The cost is real: the leaf direction probe
    # plus two writes is up to six pselects, and marble's 5.10 compact-waiter
    # route survives one only about four times in five, so a run that already
    # won W2 can still lose to W3 and reboot. Budget one attempt per write;
    # w3_chain_rounds carries the retries.
    w3_chain_rounds = 1
    w3_attempts = 1
    w3_settle_us = 50000
  }
  handoff {
    pre_dispatch_settle_ms = 2000
    module_poll_attempts = 30
    module_poll_interval_ms = 100
    enforce_poll_attempts = 200
    enforce_poll_interval_ms = 100
  }
  heap {
    prepare_max_attempts = 4
    prepare_timeout_ms = 240000
    kernelsnitch_timeout_ms = 60000
  }
  routes {
    select_stack {
      enter_delay_us = 50000
      timeout_us = 200000
      consumer_max_calls = 1
      consumer_burst_calls = 1
    }
  }
}
